name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  # The Veneer plugin rides on every release: Veneer installs a plugin from the latest GitHub
  # release, reading its manifest.json and main.js assets. Built and tested first, so a broken
  # plugin stops the release before anything is published.
  veneer-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veneer-plugin

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Check the manifest version matches the tag
      run: |
        tag="${GITHUB_REF_NAME#v}"
        manifest="$(node -p "require('./manifest.json').version")"
        if [ "$manifest" != "$tag" ]; then
          echo "veneer-plugin/manifest.json is $manifest but the tag is $GITHUB_REF_NAME; release with release.py, which bumps both."
          exit 1
        fi

    - name: Install, typecheck, test, and build
      run: |
        npm ci
        npm run typecheck
        npm test
        npm run build

    - uses: actions/upload-artifact@v4
      with:
        name: veneer-plugin
        path: |
          veneer-plugin/manifest.json
          veneer-plugin/main.js
        if-no-files-found: error

  release:
    needs: veneer-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: python -m twine check dist/*

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*

    - uses: actions/download-artifact@v4
      with:
        name: veneer-plugin
        path: veneer-plugin-release

    - name: Create GitHub Release with the Veneer plugin
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          veneer-plugin-release/manifest.json \
          veneer-plugin-release/main.js \
          --title "Release $GITHUB_REF_NAME" \
          --notes "BookForge $GITHUB_REF_NAME. The manifest.json and main.js assets are the Veneer plugin: install it in Veneer from Settings, Plugins, Install from GitHub (eristoddle/bookforge)."
